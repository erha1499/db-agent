[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "db-agent"
version = "0.1.0"
description = "面向研发人员的数据库预检与诊断 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiomysql[rsa]>=0.3.2,<0.4",
    "fastapi>=0.115,<1",
    "langchain>=1.4,<2",
    "langchain-openai>=1.6,<2",
    "langsmith>=0.4,<1",
    "openai>=3.11,<4",
    "pydantic-settings>=2.15,<3",
    "pymysql>=1.2.0",
    "sqlglot>=30,<31",
    "uvicorn>=0.30,<1",
]

[project.scripts]
db-agent = "db_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
build = ["hatchling>=1.27,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/db_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/evals", "/docs", "/infra", "/.github",
    "/README.md", "/TODO.md", "/AGENTS.md", "/LICENSE", "/compose.yaml",
    "/pyproject.toml", "/uv.lock", "/.python-version", "/.env.example", "/.gitignore",
    "/frontend/src", "/frontend/tests", "/frontend/*.json", "/frontend/*.ts",
    "/frontend/index.html", "/frontend/.prettierrc.json",
]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

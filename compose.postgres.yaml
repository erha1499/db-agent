name: db-agent-postgres

services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: db_agent_pg
      POSTGRES_PASSWORD: ${DB_AGENT_POSTGRES_ADMIN_PASSWORD:?Set the admin password in .env.postgres}
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
      DB_AGENT_POSTGRES_PASSWORD: ${DB_AGENT_POSTGRES_PASSWORD:?Set the reader password in .env.postgres}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - timezone=UTC
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${DB_AGENT_POSTGRES_PASSWORD}"
          psql --host=127.0.0.1 --username=db_agent_reader --dbname=db_agent_pg
          --no-psqlrc --command='SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    cpus: 2.0
    mem_limit: 1g

volumes:
  postgres_data:

name: db-agent

services:
  mysql:
    image: mysql:8.4.11@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_AGENT_MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_AGENT_MYSQL_ROOT_PASSWORD:?Set a root password in .env}
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: db_agent
      DB_AGENT_MYSQL_PASSWORD: ${DB_AGENT_MYSQL_PASSWORD:?Set a reader password in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=50
      - --local-infile=OFF
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${DB_AGENT_MYSQL_PASSWORD}"
          mysql --protocol=TCP --host=127.0.0.1 --user=db_agent_reader
          --database=db_agent --execute='SELECT 1' --silent >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    cpus: 2.0
    mem_limit: 1g

volumes:
  mysql_data:
